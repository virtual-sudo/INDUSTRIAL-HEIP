<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Force the absolute bounds of the frame */
        html, body { 
            margin: 0; 
            padding: 0; 
            background: transparent !important; 
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: left;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            /* This makes the container take up the full space of your Vista box */
            width: 100%;
            height: 100%;
            gap: 4%; 
            box-sizing: border-box;
            padding: 2%; /* Tiny safety margin so it doesn't clip */
        }

        .node {
            /* Circle takes up nearly the full height of the box */
            height: 80%; 
            aspect-ratio: 1 / 1;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
            animation: pulse 2s infinite ease-in-out;
            flex-shrink: 0;
        }

        .label {
            background: #1b492b;
            color: #ffffff;
            /* Box height matches the circle */
            height: 80%;
            /* Flex-grow makes the green box expand to fill the rest of the width */
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            
            border-radius: 4px;
            /* FONT SIZE: Tied to the height of your Vista Web Frame */
            font-size: 55vh; 
            
            font-family: 'Arial Black', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            white-space: nowrap;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="node"></div>
        <div id="text" class="label">LOADING...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name') || 'HEIP';
        document.getElementById('text').innerText = name.toUpperCase();
    </script>
</body>
</html>
