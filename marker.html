<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            background: transparent !important; 
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center; /* Centers the marker in your Web Frame */
        }

        .container {
            display: flex;
            align-items: center;
            gap: 20px;
            /* This is the magic line - adjust the 2.5 to make it even bigger */
            transform: scale(2.5); 
            transform-origin: center;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        .node {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 20px white;
            animation: pulse 2s infinite ease-in-out;
            flex-shrink: 0;
        }

        .label {
            background: #1b492b;
            color: white;
            padding: 8px 18px;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.3);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="node"></div>
        <div id="text" class="label">LOADING...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name') || 'HEIP';
        document.getElementById('text').innerText = name.toUpperCase();
    </script>
</body>
</html>
