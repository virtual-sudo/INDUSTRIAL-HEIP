<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 1. Force the page to be exactly the size of the 3DVista Web Frame */
        html, body { 
            margin: 0; 
            padding: 0; 
            background: transparent !important; 
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 2. The container now fills 100% of the space you give it in Vista */
        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            gap: 5%; /* Gap scales with frame size */
        }

        /* 3. The node scales based on the height of the frame */
        .node {
            height: 60%; /* Uses 60% of the Web Frame's height */
            aspect-ratio: 1 / 1; /* Keeps it a perfect circle */
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
            animation: pulse 2s infinite ease-in-out;
            flex-shrink: 0;
        }

        /* 4. The label scales its font based on the frame height */
        .label {
            background: #1b492b;
            color: #ffffff;
            height: 60%; /* Matches the node height */
            padding: 0 5%; /* Horizontal padding relative to width */
            border-radius: 5px;
            
            /* DYNAMIC FONT: This is the secret. 
               It scales the text to roughly 40% of the frame's height */
            font-size: 45vh; 
            
            font-family: 'Arial Black', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            white-space: nowrap;
            border: 2px solid rgba(255, 255, 255, 0.3);
            
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.1); filter: brightness(1.2); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="node"></div>
        <div id="text" class="label">LOADING...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name') || 'HEIP';
        document.getElementById('text').innerText = name.toUpperCase();
    </script>
</body>
</html>
