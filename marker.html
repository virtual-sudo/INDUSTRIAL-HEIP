<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            background: transparent !important; 
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4vw; /* Responsive gap */
            width: 95%; /* Fills 95% of the Web Frame width */
            height: 90%; /* Fills 90% of the Web Frame height */
        }

        .node {
            /* Responsive sizing based on the smaller dimension of the frame */
            width: 15vh; 
            height: 15vh;
            max-width: 40px; /* Safety cap */
            max-height: 40px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 2vw white;
            animation: pulse 2s infinite ease-in-out;
            flex-shrink: 0;
        }

        .label {
            background: #1b492b;
            color: white;
            /* Padding and Font scale based on the height of the frame */
            padding: 2vh 4vw; 
            border-radius: 1vh;
            font-family: 'Arial Black', sans-serif;
            font-size: 25px; /* Large base size */
            font-weight: 900;
            text-transform: uppercase;
            white-space: nowrap;
            border: 0.5vh solid rgba(255,255,255,0.3);
            box-shadow: 0 1vh 2vh rgba(0,0,0,0.5);
            
            /* This ensures the text scales to fit the box */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="node"></div>
        <div id="text" class="label">LOADING...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name') || 'HEIP';
        document.getElementById('text').innerText = name.toUpperCase();
    </script>
</body>
</html>
