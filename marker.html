<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 1. Reset and Transparent Background */
        html, body { 
            margin: 0; 
            padding: 0; 
            background: transparent !important; 
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            display: flex;
            align-items: center;
            /* Using a much higher multiplier (8vh) to fight the high-res shrink */
            gap: 2vh; 
            padding: 2vh;
            filter: drop-shadow(0 0.5vh 1vh rgba(0,0,0,0.5));
        }

        .node {
            /* Large circle to match your reference photo */
            width: 10vh; 
            height: 10vh;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 3vh rgba(255, 255, 255, 0.9);
            animation: pulse 2s infinite ease-in-out;
            flex-shrink: 0;
        }

        .label {
            background: #1b492b; /* Matching the Hermosa industrial green */
            color: #ffffff;
            /* Dynamic padding and huge font to fill the 8000px panorama space */
            padding: 1.5vh 4vh;
            border-radius: 1vh;
            font-size: 6vh; 
            font-family: 'Arial Black', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            white-space: nowrap;
            border: 0.4vh solid rgba(255, 255, 255, 0.3);
            letter-spacing: 0.2vh;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.15); filter: brightness(1.2); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="node"></div>
        <div id="text" class="label">LOADING...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name') || 'HEIP';
        document.getElementById('text').innerText = name.toUpperCase();
    </script>
</body>
</html>
