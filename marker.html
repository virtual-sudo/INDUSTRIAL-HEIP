<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            background: transparent !important; 
            overflow: hidden; 
            font-family: 'Arial Black', sans-serif; /* Thicker font for visibility */
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .container {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px;
            /* SCALE THIS NUMBER to make the whole thing bigger or smaller */
            transform: scale(1.5); 
            transform-origin: left center;
        }

        .node {
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 20px white;
            animation: pulse 2s infinite ease-in-out;
            flex-shrink: 0;
        }

        .label {
            background: #1b492b;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px; /* Increased font size */
            font-weight: 900;
            text-transform: uppercase;
            white-space: nowrap;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.3);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.3); filter: brightness(1.3); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="node"></div>
        <div id="text" class="label">LOADING...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const landmarkName = urlParams.get('name') || 'HEIP';
        document.getElementById('text').innerText = landmarkName.toUpperCase();
    </script>
</body>
</html>
