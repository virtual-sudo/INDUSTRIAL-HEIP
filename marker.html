<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Force the absolute bounds of the frame */
        html, body { 
            margin: 0; 
            padding: 0; 
            background: transparent !important; 
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: left;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            /* This makes the container take up the full space of your Vista box */
            width: 100%;
            height: 100%;
            gap: 4%; 
            box-sizing: border-box;
            padding: 2%; /* Tiny safety margin so it doesn't clip */
            transition: gap 0.2s ease, padding 0.2s ease;
        }

        .node {
            /* Circle takes up nearly the full height of the box */
            height: 80%; 
            width: auto; /* Ensures width complies strictly with aspect-ratio */
            aspect-ratio: 1 / 1;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
            animation: pulse 2s infinite ease-in-out;
            flex-shrink: 0;
            transition: height 0.2s ease;
        }

        .label {
            background: #1b492b;
            color: #ffffff;
            /* Box height matches the circle */
            height: 80%;
            /* Flex-grow makes the green box expand to fill the rest of the width */
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            
            border-radius: 4px;
            
            font-family: 'Arial Black', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            white-space: nowrap;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            
            /* Structural safety rules to prevent flattening */
            overflow: hidden;
            padding: 0 12px;
            box-sizing: border-box;
            line-height: 1; 
            transition: height 0.2s ease, padding 0.2s ease;
        }

        /* --- RESPONSIVE MEDIA QUERIES --- */

        /* Targets smaller screens or narrower 3DVista frame widths */
        @media (max-width: 600px) {
            .container {
                gap: 2%; /* Tighten space between components */
                padding: 1%;
            }
            .node {
                height: 75%; /* Slightly scale down circle to yield width to text */
            }
            .label {
                height: 75%;
                padding: 0 6px; /* Narrower internal text padding */
            }
        }

        /* Targets highly restrictive mini-display frames */
        @media (max-width: 380px) {
            .container {
                gap: 1.5%;
            }
            .node, .label {
                height: 70%; /* Give maximum horizontal breathing room to prevent extreme text clipping */
            }
        }

        /* Targets ultra-short horizontal banners */
        @media (max-height: 120px) {
            .node, .label {
                height: 90%; /* Maximize vertical layout usage when the frame height is tiny */
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="node"></div>
        <div id="text" class="label">LOADING...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name') || 'BIOTEQUE';
        const textContainer = document.getElementById('text');
        
        textContainer.innerText = name.toUpperCase();

        function autoFitText() {
            // Start at 85% of the container height to guarantee a clean vertical safety cushion
            let fontSize = textContainer.clientHeight * 0.85;
            textContainer.style.fontSize = fontSize + 'px';

            // Shrink down with high-precision increments if text overflows width OR height bounds
            while (
                (textContainer.scrollWidth > textContainer.clientWidth || 
                 textContainer.scrollHeight > textContainer.clientHeight) && 
                fontSize > 1
            ) {
                fontSize -= 0.5;
                textContainer.style.fontSize = fontSize + 'px';
            }
        }

        // Live monitor for browser changes and 3DVista frame modifications
        const resizeObserver = new ResizeObserver(() => {
            autoFitText();
        });
        resizeObserver.observe(document.body);

        // Run setup immediately
        autoFitText();
    </script>
</body>
</html>
